name: Refresh theme catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: theme-catalog-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record the tested base
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Refresh source snapshots and generated theme assets
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN_COMMUNITY_CATALOG_SNAPSHOTS: "1"

      - name: Test the generated marketplace
        run: npm test

      - name: Check generated whitespace
        run: git diff --check

      - name: Commit and publish the tested refresh
        env:
          BASE_COMMIT: ${{ steps.base.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/catalog.json site/explorer-data.json site/assets/img/themes/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Theme catalog is already current."
            exit 0
          fi
          git commit -m "Refresh theme catalog"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_COMMIT" ]; then
            echo "main changed after the tested refresh; refusing to publish stale generated files." >&2
            exit 1
          fi
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${authorization}" push origin HEAD:main
