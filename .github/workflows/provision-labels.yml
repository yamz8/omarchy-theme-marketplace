name: Provision theme workflow labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update required labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          provision_label() {
            name="$1"
            color="$2"
            description="$3"
            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/${name}" -f color="$color" -f description="$description" >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" -f name="$name" -f color="$color" -f description="$description" >/dev/null
            fi
          }
          provision_label theme-submission f97316 "Community theme proposal"
          provision_label theme-validated 2da44e "Theme structure passed exact-snapshot validation"
          provision_label theme-needs-fixes d1242f "Theme proposal requires changes"
          provision_label approved-theme 8250df "Authorized publication decision"
          provision_label rights-request bfd4f2 "Rights or asset removal request"
