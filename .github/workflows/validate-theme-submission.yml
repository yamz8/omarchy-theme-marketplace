name: Validate theme submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: theme-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: startsWith(github.event.issue.title, '[Theme]:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out marketplace validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Inspect the exact current theme snapshot
        id: validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          node scripts/validate-theme-submission.mjs > "$RUNNER_TEMP/theme-validation.json"
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish deterministic validation feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/theme-submission-feedback.mjs "$RUNNER_TEMP/theme-validation.json"

      - name: Fail when validation needs changes
        if: steps.validation.outputs.status != '0'
        run: exit 1
